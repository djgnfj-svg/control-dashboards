<script>
// ←→ · PgUp/PgDn · Space 로 넘기고, #3 처럼 번호로 들어오면 그 장부터
(() => {
  const slides = [...document.querySelectorAll('.deck-slide')];
  let cur = 0;
  const go = (i, smooth = true) => {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    const root = document.documentElement;
    if (!smooth) root.style.scrollBehavior = 'auto';  // CSS 의 smooth 를 잠시 끄고 바로 간다
    slides[cur].scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'center' });
    if (!smooth) root.style.scrollBehavior = '';
  };
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) cur = slides.indexOf(e.target); }), { threshold: 0.6 });
  slides.forEach(s => io.observe(s));
  addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    if (e.key === 'Home') { e.preventDefault(); go(0); }
    if (e.key === 'End') { e.preventDefault(); go(slides.length - 1); }
  });
  const fromHash = smooth => { const n = +location.hash.slice(1); if (n > 0 && n <= slides.length) go(n - 1, smooth); };
  fromHash(false);
  addEventListener('hashchange', () => fromHash(true));
})();
</script>
